name: Build Clean Android AAB (Google Play Bundle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      admob_app_id:
        description: 'Google AdMob App ID (optional, leave blank for official test ads)'
        required: false
        default: 'ca-app-pub-3940256099942544~3347511713'

jobs:
  build-aab:
    name: Generate Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (Official Android Build SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps

      - name: Build Pure Web Assets (Vite)
        run: npm run build

      - name: Initialize Android Native Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Manifest & Permissions (AdMob & Internet)
        run: |
          ADMOB_APP_ID="${{ github.event.inputs.admob_app_id }}"
          if [ -z "$ADMOB_APP_ID" ]; then
            ADMOB_APP_ID="ca-app-pub-3940256099942544~3347511713"
          fi
          
          python3 - <<EOF
          import xml.etree.ElementTree as ET

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ns)

          # Ensure required permissions
          perms = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'com.google.android.gms.permission.AD_ID'
          ]
          existing = [e.attrib.get(f'{{{ns}}}name') for e in root.findall('uses-permission')]
          for p in perms:
              if p not in existing:
                  e = ET.SubElement(root, 'uses-permission')
                  e.set(f'{{{ns}}}name', p)

          # Ensure AdMob Application ID meta-data inside <application>
          app = root.find('application')
          if app is not None:
              for meta in app.findall('meta-data'):
                  if meta.attrib.get(f'{{{ns}}}name') == 'com.google.android.gms.ads.APPLICATION_ID':
                      app.remove(meta)
              m = ET.SubElement(app, 'meta-data')
              m.set(f'{{{ns}}}name', 'com.google.android.gms.ads.APPLICATION_ID')
              m.set(f'{{{ns}}}value', '$ADMOB_APP_ID')

          tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
          print('Successfully configured AndroidManifest.xml')
          EOF

      - name: Disable Strict Lint & Setup Gradle Build Config
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i '/android {/a \    lintOptions { abortOnError false; checkReleaseBuilds false; }' android/app/build.gradle
          fi

      - name: Build Android App Bundle (.aab) with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease -x lint -x lintVitalAnalyzeRelease -x test --no-daemon --stacktrace

      - name: Sign AAB Bundle for Google Play Store
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            echo "Found AAB at $AAB_PATH. Signing with release keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias attendanceplus -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "attendance123" -keypass "attendance123" \
              -dname "CN=Attendance Plus, OU=Mobile, O=Dev Kumar, L=Delhi, C=IN"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "attendance123" -keypass "attendance123" "$AAB_PATH" attendanceplus
            echo "Successfully signed AAB!"
          fi

      - name: Upload Clean AAB Artifact (Direct Phone Download)
        uses: actions/upload-artifact@v4
        with:
          name: AttendancePlus-PlayStore-Release-AAB
          path: |
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 14

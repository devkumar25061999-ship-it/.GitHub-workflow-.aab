name: Build Clean Android AAB (Google Play Bundle)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      admob_app_id:
        description: 'Google AdMob App ID'
        required: false
        default: 'ca-app-pub-3940256099942544~3347511713'

jobs:
  build-aab:
    name: Generate Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17 (Official Android Build SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor-community/admob@latest --legacy-peer-deps

      - name: Build Pure Web Assets (Vite)
        run: npm run build

      - name: Initialize Android Native Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Manifest & Permissions (AdMob & Internet)
        run: |
          ADMOB_ID="${{ github.event.inputs.admob_app_id }}"
          if [ -z "$ADMOB_ID" ]; then
            ADMOB_ID="ca-app-pub-3940256099942544~3347511713"
          fi
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' $MANIFEST
          sed -i "/<\/application>/i \        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_ID\" />" $MANIFEST

      - name: Build Android App Bundle (.aab) with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Sign AAB Bundle for Google Play Store
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            echo "Signing with release keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias attendanceplus -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "attendance123" -keypass "attendance123" \
              -dname "CN=Attendance Plus, OU=Mobile, O=Dev Kumar, L=Delhi, C=IN"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "attendance123" -keypass "attendance123" "$AAB_PATH" attendanceplus
          fi

      - name: Upload Clean AAB Artifact (Direct Phone Download)
        uses: actions/upload-artifact@v4
        with:
          name: AttendancePlus-PlayStore-Release-AAB
          path: |
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 14

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Black Squircle Background -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  
  <!-- Subtle White Border Ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>
  
  <!-- Notepad Body -->
  <rect x="96" y="86" width="320" height="340" rx="32" fill="#000000" stroke="#ffffff" stroke-width="18"/>
  

  <line x1="150" y1="64" x2="150" y2="108" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <line x1="210" y1="64" x2="210" y2="108" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <line x1="270" y1="64" x2="270" y2="108" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <line x1="330" y1="64" x2="330" y2="108" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Notepad Content Lines -->
  <line x1="140" y1="160" x2="372" y2="160" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
